<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Cumpleaños</title>
<link rel="icon" type="image/png" href="Icons/favicon_io/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">
  <h1 class="intro-title">Ha llegado carta 💌</h1>
  <p class="intro-sub">Utiliza las flechas para elegir una carta</p>

  <div class="envelope-carousel-container">
    <button class="carousel-arrow prev" id="prevEnvelope">‹</button>
    
    <div class="envelope-viewport">
      <div class="envelope-track" id="envelopeTrack">
        </div>
    </div>

    <button class="carousel-arrow next" id="nextEnvelope">›</button>
  </div>

  <p class="envelope-hint">haz clic en el sobre para leer la carta</p>

  <div class="carousel-dots" id="envelopeDots"></div>
</div>

<div class="letter-modal" id="letterModal">
  <div class="letter-paper">
    <button class="close-x" id="closeLetterBtn">✕</button>
    <div class="letter-heading" id="modalTitle">Para ti,</div>
    <div class="letter-text" id="modalText"></div>
    <div class="letter-sign" id="modalSign">Con todo mi cariño.</div>
  </div>
</div>

<script src="letters.js"></script>
<script src="script.js"></script>
</body>
<footer>
  <p>Creado con ❤️ por tio telo</p>
</footer>
</html>
